[tool.poetry]
name = "py3moin"
version = "3.0.0a1"
description = ""
authors = ["Zhongke Chen <ch3n2k@gmail.com>"]
packages = [{ include = "MoinMoin" }]

[tool.poetry.dependencies]
python = "^3.10"
pytest = "^7.2"
passlib = "^1.7"
future = "^0.18"
html-sanitizer = "^2.6"
werkzeug = "^3.1.8"
parsedatetime = "^2.6"
flup = "^1.0"
pygments = "^2.15"
python3-openid = { version = "^3.2", optional = true }

[tool.poetry.extras]
openid = ["python3-openid"]

[tool.poetry.scripts]
moin = "MoinMoin.script.moin:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
